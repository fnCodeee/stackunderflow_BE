name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - name: PHP syntax sweep
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      # tests/unit_test.php is a local regression runner: it
      # needs a live database and seeds dummy rows, so it is
      # deliberately not run in CI (audit P2 #24).
